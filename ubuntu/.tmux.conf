# -------------------------------------------
# tmux config optimized for Claude Code
# -------------------------------------------

# Use Ctrl+A as prefix (easier than Ctrl+B on most keyboards)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse (scroll through Claude Code output, click panes)
set -g mouse on

# Longer scrollback buffer (Claude Code can be verbose)
set -g history-limit 50000

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Faster key repetition
set -sg escape-time 10

# 256 color support — tmux-256color declares more capabilities than screen-256color,
# which helps inner apps negotiate features like extended keys with tmux.
set -g default-terminal "tmux-256color"

# Extended key sequences (Shift+Enter, Ctrl+Enter, etc.)
# "always" sends extended sequences to all inner apps unconditionally,
# rather than waiting for apps to opt-in via modifyOtherKeys/kitty-protocol escapes.
set -g extended-keys always
set -ga terminal-features 'xterm-256color:extkeys'

# Status bar
set -g status-style 'bg=#333333 fg=#ffffff'
set -g status-left '#[fg=#88cc88][#S] '
set -g status-right '#[fg=#888888]%H:%M '

# Easy splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Easy pane navigation (Alt+arrow)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"
