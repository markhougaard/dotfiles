# Ubuntu links that do not live at the top level of $HOME. Same format as the
# shared links.conf: source (relative to this file), then destination.

# ob wrapper: pins obsidian-headless to apt's node (see the script).
bin/ob   ~/.local/bin/ob

# systemd units are copied, not linked: systemd treats a symlinked unit file as
# a "linked" unit, and `systemctl disable` deletes the link. See ubuntu/AGENTS.md.
