# macOS links that do not live at the top level of $HOME.
#
# Format: <source, relative to this file>  <destination>
# The first whitespace-delimited field is the source; the rest of the line is
# the destination, so no quoting is needed for paths containing spaces.
# ~ and $HOME are expanded. Blank lines and # comments are ignored.
#
# VS Code rewrites these files when you change a setting through the UI. It
# writes through the symlink, so edits land in the repo - but if a VS Code
# update ever replaces the link with a plain file, `./link.sh --dry-run` will
# show it as needing to be re-linked.

vscode/settings.json      ~/Library/Application Support/Code/User/settings.json
vscode/keybindings.json   ~/Library/Application Support/Code/User/keybindings.json

gnupg/gpg-agent.conf      ~/.gnupg/gpg-agent.conf
