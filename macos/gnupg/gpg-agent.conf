# gpg-agent configuration. Linked to ~/.gnupg/gpg-agent.conf by macos/links.conf.
# macOS-specific because pinentry-program is an absolute, platform-local path.
#
# Cache timings are a trade-off: too short and signing every commit means
# retyping the passphrase; too long and an unlocked laptop can sign as you.

# Prompt for the passphrase in a native macOS dialog rather than on the
# terminal. Without this, anything with no controlling TTY - VS Code, a GUI git
# client, a script - fails with "cannot open /dev/tty" instead of asking.
#
# pinentry-mac offers to save the passphrase to the login keychain. Leave that
# unticked: it turns the passphrase into a property of an unlocked Mac rather
# than something you know, which is most of the point of having one.
pinentry-program /opt/homebrew/bin/pinentry-mac

# Forget the passphrase 10 minutes after it was last used...
default-cache-ttl 600
# ...and always after 2 hours, no matter how often it has been used.
max-cache-ttl 7200

# Same, for SSH keys held by the agent.
default-cache-ttl-ssh 600
max-cache-ttl-ssh 7200

# Run `gpgconf --kill gpg-agent` after editing this file to apply changes.
