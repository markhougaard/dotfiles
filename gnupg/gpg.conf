# GnuPG configuration. Linked to ~/.gnupg/gpg.conf by links.conf.
#
# Contains no key material - only preferences. The secret keys live in
# ~/.gnupg/private-keys-v1.d/ and are never tracked here.

# Always show full fingerprints and long key IDs. Short IDs (8 hex chars) are
# trivially collidable and should never be used to identify a key.
keyid-format 0xlong
with-fingerprint
with-subkey-fingerprint

# Algorithm preferences for keys generated and messages produced here.
personal-cipher-preferences AES256 AES192 AES
personal-digest-preferences SHA512 SHA384 SHA256
personal-compress-preferences ZLIB BZIP2 ZIP Uncompressed
default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB BZIP2 ZIP Uncompressed

# Hash used for key certifications and for passphrase-to-key derivation.
cert-digest-algo SHA512
s2k-digest-algo SHA512
s2k-cipher-algo AES256

# Don't advertise the GnuPG version in output.
no-emit-version
no-comments

# Refuse the weak algorithms outright rather than warning.
weak-digest SHA1

# Deliberately NOT set: auto-key-retrieve. It makes GnuPG fetch unknown keys
# from a keyserver whenever it verifies a signature, which tells the keyserver
# operator which signatures you are checking and when. Fetch keys explicitly:
#   gpg --recv-keys <fingerprint>
keyserver hkps://keys.openpgp.org
