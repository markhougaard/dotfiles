# Shared links that do not live at the top level of $HOME, applied on every
# platform. Same format as the per-platform links.conf files: the first
# whitespace-delimited field is the source (relative to this file), the rest of
# the line is the destination. ~ and $HOME are expanded.
#
# Only GnuPG's *configuration* is tracked. Secret keys live in
# ~/.gnupg/private-keys-v1.d/ and must never be committed - back them up
# out-of-band (see README, "GPG signing").

# gpg-agent.conf is not here: it names a platform-local pinentry binary, so it
# lives in macos/links.conf instead.
gnupg/gpg.conf         ~/.gnupg/gpg.conf
